[package]
name = "reims-windows-backend-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: this probe is not part of reims-vgpu's workspace, so it never enables its `testkit`
# feature (whose fake platform is unix-only).
[workspace]

[dependencies]
reims-vgpu-vulkan = { path = "D:/reims-vgpu/crates/reims-vgpu-vulkan" }

# The same vendored redirect the reims-vgpu workspace applies, so the runtime is the Windows port.
[patch."https://github.com/steelbrain/metal2vulkan"]
metal2vulkan = { path = "D:/reims-vgpu/vendor/metal2vulkan/crates/metal2vulkan" }
metal2vulkan-runtime = { path = "D:/reims-vgpu/vendor/metal2vulkan/crates/metal2vulkan-runtime" }
metal2vulkan-air = { path = "D:/reims-vgpu/vendor/metal2vulkan/crates/metal2vulkan-air" }
